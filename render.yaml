# Render service manifest for the backend
# This file should be in the delivery root for the Render service.
services:
  - type: web
    name: face-detector-backend
    env: python
    region: oregon
    plan: free
    branch: main
    pythonVersion: "3.11.8"
    buildCommand: python -m pip install --upgrade pip setuptools wheel && python -m pip install --prefer-binary -r requirements.txt
    startCommand: python -m waitress --listen=0.0.0.0:$PORT main:app
    envVars:
      - key: CORS_ORIGINS
        value: "*" # set to your frontend origin in production, e.g. https://my-frontend.vercel.app
# IMPORTANT: If you set the Start Command manually in Render UI, use $PORT exactly,
# not $5000 or a literal port number.
